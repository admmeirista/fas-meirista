<!DOCTYPE html>
<html lang="id">
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
  :root {
    --green-900: #0F3D2E; --green-800: #14513C; --green-700: #1A6B4F; --green-600: #208562; --green-100: #E3F1EA; --green-50: #F2F8F5;
    --orange-600: #D9731A; --orange-100: #FDEBD9;
    --red-600: #C2410C; --red-700: #B42318; --red-100: #FDE8E6;
    --ink-900: #18211D; --ink-700: #3B4741; --ink-500: #66736C; --ink-300: #A9B3AE;
    --line: #E3E8E5; --surface: #FFFFFF; --bg: #F6F8F7; --hover: #F0F4F2;
    --radius: 10px; --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(16, 40, 30, .06), 0 1px 3px rgba(16, 40, 30, .05);
    --sidebar: 236px;
    --font: "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink-900); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--green-700); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
  h1 { font-size: 20px; } h2 { font-size: 16px; } h3 { font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .neg { color: var(--red-700); }
  .muted { color: var(--ink-500); }
  .small { font-size: 12px; }
  .hidden { display: none !important; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .stack > * + * { margin-top: 16px; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

  /* Layout */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: var(--sidebar); background: var(--green-900); color: #DCEBE3; position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column; z-index: 30; transition: width .15s, transform .2s; }
  .brand { padding: 18px 18px 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid rgba(255,255,255,.08); }
  .brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--green-600); display: grid; place-items: center; color: #fff; font-weight: 700; flex: none; }
  .brand-name { font-weight: 700; color: #fff; font-size: 15px; line-height: 1.1; }
  .brand-sub { font-size: 11px; color: #9CC2B0; }
  .nav { padding: 10px 8px; flex: 1; overflow-y: auto; }
  .nav button { width: 100%; display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 0; background: none; color: inherit; border-radius: 8px; cursor: pointer; text-align: left; min-height: 42px; }
  .nav button:hover { background: rgba(255,255,255,.06); }
  .nav button.active { background: var(--green-700); color: #fff; font-weight: 600; }
  .nav svg { width: 18px; height: 18px; flex: none; opacity: .9; }
  .sidebar-foot { padding: 12px 18px; font-size: 11px; color: #8FB5A3; border-top: 1px solid rgba(255,255,255,.08); }
  .collapsed .sidebar { width: 64px; }
  .collapsed .sidebar .label, .collapsed .brand-text, .collapsed .sidebar-foot { display: none; }
  .collapsed .main { margin-left: 64px; }
  .main { flex: 1; margin-left: var(--sidebar); min-width: 0; transition: margin .15s; }
  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(246,248,247,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 10px 24px; min-height: 56px; }
  .topbar h1 { font-size: 17px; }
  .content { padding: 20px 24px 64px; max-width: 1280px; }
  .icon-btn { border: 0; background: none; width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--ink-700); }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn svg { width: 20px; height: 20px; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--green-100); color: var(--green-800); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
  .env-badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--orange-100); color: var(--orange-600); font-weight: 600; }

  /* Cards & panels */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-h { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .card-b { padding: 16px; }
  .kpi { padding: 14px 16px; }
  .kpi .k-label { font-size: 12px; color: var(--ink-500); }
  .kpi .k-value { font-size: 20px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .k-sub { font-size: 11px; color: var(--ink-500); margin-top: 2px; }
  .banner { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
  .banner.warn { background: var(--orange-100); color: #7A3E06; }
  .banner.err { background: var(--red-100); color: var(--red-700); }
  .banner.ok { background: var(--green-100); color: var(--green-800); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 550; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.primary { background: var(--green-700); border-color: var(--green-700); color: #fff; }
  .btn.primary:hover { background: var(--green-800); }
  .btn.accent { background: var(--orange-600); border-color: var(--orange-600); color: #fff; }
  .btn.danger { color: var(--red-700); border-color: #F3C7C1; }
  .btn.danger:hover { background: var(--red-100); }
  .btn.ghost { border-color: transparent; background: none; }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
  .btn svg { width: 16px; height: 16px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .chip.active { background: var(--green-700); color: #fff; border-color: var(--green-700); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  .tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--ink-500); white-space: nowrap; }
  .tabs button.active { color: var(--green-800); border-bottom-color: var(--green-700); font-weight: 600; }

  /* Forms */
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { font-size: 12px; font-weight: 600; color: var(--ink-700); }
  .field .hint { font-size: 11px; color: var(--ink-500); font-weight: 400; }
  .input, select.input, textarea.input { height: 40px; padding: 0 12px; border: 1px solid #D3DBD7; border-radius: 8px; background: #fff; width: 100%; min-width: 0; }
  textarea.input { height: auto; padding: 10px 12px; min-height: 64px; resize: vertical; }
  .input:focus { outline: 2px solid rgba(32,133,98,.25); border-color: var(--green-600); }
  .input.invalid { border-color: var(--red-600); background: #FFF8F7; }
  .input.money { text-align: right; font-variant-numeric: tabular-nums; }
  .err-text { color: var(--red-700); font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid #D3DBD7; border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 0 12px; height: 38px; cursor: pointer; border-right: 1px solid #D3DBD7; }
  .seg button:last-child { border-right: 0; }
  .seg button.active { background: var(--green-700); color: #fff; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; }
  table.t th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-500); padding: 10px 12px; border-bottom: 1px solid var(--line); background: #FAFBFA; white-space: nowrap; }
  table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.t tr.click { cursor: pointer; }
  table.t tr.click:hover td { background: var(--hover); }
  table.t tr.sec td { background: #FAFBFA; font-weight: 600; }
  table.t tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
  table.t tr.grand td { font-weight: 700; background: var(--green-50); }
  table.t td.indent { padding-left: 28px; }
  table.t td.indent2 { padding-left: 44px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: #EEF1EF; color: var(--ink-700); white-space: nowrap; }
  .badge.POSTED, .badge.ACTIVE, .badge.OPEN { background: var(--green-100); color: var(--green-800); }
  .badge.DRAFT { background: #EAF0FB; color: #2B4C8C; }
  .badge.REVERSED, .badge.DISPOSED, .badge.LOCKED { background: #EEF1EF; color: var(--ink-500); }
  .badge.FAILED, .badge.DISABLED { background: var(--red-100); color: var(--red-700); }
  .badge.PENDING, .badge.FULLY_DEPRECIATED { background: var(--orange-100); color: #8A4A0B; }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 10px 12px; font-size: 13px; color: var(--ink-500); }
  .empty { padding: 36px 16px; text-align: center; color: var(--ink-500); }
  .mlist { display: none; }
  .mitem { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; cursor: pointer; }
  .mitem:last-child { border-bottom: 0; }

  /* Drawer & dialog */
  .scrim { position: fixed; inset: 0; background: rgba(15, 30, 23, .35); z-index: 40; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 41; display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.08); }
  .drawer-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .drawer-b { padding: 18px; overflow-y: auto; flex: 1; }
  .drawer-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; background: #FAFBFA; }
  .dialog { position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100% - 32px)); background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
  .dialog-scrim { z-index: 50; }
  .preview { background: var(--green-50); border: 1px dashed #BFD9CC; border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .preview table { width: 100%; border-collapse: collapse; }
  .preview td { padding: 3px 4px; }

  /* Toast & loader */
  #toasts { position: fixed; z-index: 60; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; max-width: calc(100% - 32px); }
  .toast { background: var(--ink-900); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); max-width: 420px; }
  .toast.err { background: var(--red-700); }
  .toast.ok { background: var(--green-800); }
  .bar-loader { position: fixed; top: 0; left: 0; height: 3px; background: var(--orange-600); z-index: 70; width: 0; transition: width .3s; }
  .bar-loader.on { width: 70%; transition: width 4s cubic-bezier(.1,.6,.2,1); }
  .skeleton { background: linear-gradient(90deg, #EEF1EF 25%, #F6F8F7 50%, #EEF1EF 75%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 6px; height: 14px; }
  @keyframes sk { to { background-position: -200% 0; } }

  /* Login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: linear-gradient(180deg, var(--green-50), var(--bg)); }
  .login-card { width: min(380px, 100%); padding: 28px; }
  .login-card .brand-mark { width: 44px; height: 44px; font-size: 18px; }

  /* Charts */
  .chart { width: 100%; height: auto; display: block; }
  .chart text { font-size: 10px; fill: var(--ink-500); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-500); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .fab { display: none; }

  @media (max-width: 1024px) {
    .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 760px) {
    .sidebar { transform: translateX(-100%); width: 260px; }
    .nav-open .sidebar { transform: none; }
    .collapsed .sidebar .label, .collapsed .brand-text { display: initial; }
    .main, .collapsed .main { margin-left: 0; }
    .topbar { padding: 8px 16px; }
    .content { padding: 16px 16px 96px; }
    .g2, .g3 { grid-template-columns: 1fr; }
    .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .form-grid { grid-template-columns: 1fr; }
    .kpi .k-value { font-size: 17px; }
    .hide-m { display: none !important; }
    .mlist { display: block; }
    .tlist { display: none; }
    .drawer { width: 100%; }
    .btn { height: 42px; }
    .input { height: 44px; }
    .fab { display: grid; position: fixed; right: 16px; bottom: 20px; z-index: 25; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--orange-600); color: #fff; place-items: center; box-shadow: 0 6px 16px rgba(217,115,26,.4); cursor: pointer; }
    .fab svg { width: 26px; height: 26px; }
    .user-chip .uname { display: none; }
    #toasts { left: 16px; right: 16px; bottom: 88px; }
  }
  @media print {
    .sidebar, .topbar, .no-print, .fab { display: none !important; }
    .main { margin: 0 !important; }
    .card { box-shadow: none; border: 0; }
  }
</style>

        out += '<rect x="' + (x0 + j * bw) + '" y="' + y1 + '" width="' + (bw - 2) + '" height="' + Math.max(y2 - y1, v ? 1 : 0) + '" rx="2" fill="' + (v < 0 && s.negColor ? s.negColor : s.color) + '"><title>' + esc(lb + ' — ' + s.name + ': ' + rp(v)) + '</title></rect>';
      });
      out += '<text x="' + (L + gw * i + gw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(lb) + '</text>';
    });
    return out + '</svg>';
  }
  function lineChart(labels, values, color) {
    var W = 640, H = 200, L = 52, B = 26, T = 10, R = 8;
    var mx = Math.max.apply(null, values.concat([0])), mn = Math.min.apply(null, values.concat([0]));
    var max = axisMax(Math.max(Math.abs(mx), Math.abs(mn))), min = mn < 0 ? -max : 0;
    var y = function (v) { return T + (H - T - B) * (max - v) / (max - min || 1); };
    var step = (W - L - R) / Math.max(labels.length - 1, 1);
    var pts = values.map(function (v, i) { return (L + step * i) + ',' + y(v); }).join(' ');
    var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
    [max, max / 2, 0, min < 0 ? min : null].forEach(function (t) {
      if (t === null) return;
      out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="#EEF1EF"/><text x="' + (L - 6) + '" y="' + (y(t) + 3) + '" text-anchor="end">' + shortRp(t) + '</text>';
    });
    out += '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2.2" stroke-linejoin="round"/>';
    values.forEach(function (v, i) { out += '<circle cx="' + (L + step * i) + '" cy="' + y(v) + '" r="3" fill="' + color + '"><title>' + esc(labels[i] + ': ' + rp(v)) + '</title></circle>'; });
    labels.forEach(function (lb, i) { out += '<text x="' + (L + step * i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(lb) + '</text>'; });
    return out + '</svg>';
  }

    /** Pratinjau jurnal di sisi klien (server tetap memvalidasi & membangun jurnal final). */
    function preview() {
      collect();
      var L = [], t = f.type, dd = f.details, A = S.boot.systemAccounts, amt = f.amount || 0;
      if (t === 'INCOME') { L.push([f.cashAccount, amt, 0]); L.push([f.categoryAccount, 0, amt]); }
      if (t === 'EXPENSE') { L.push([f.categoryAccount, amt, 0]); L.push([f.cashAccount, 0, amt]); }
      if (t === 'TRANSFER') { L.push([f.toCashAccount, amt, 0]); L.push([f.cashAccount, 0, amt]); if (dd.fee) { L.push([A.ACC_BANK_FEE, dd.fee, 0]); L.push([f.cashAccount, 0, dd.fee]); } }
      if (t === 'SALE') {
        var net = amt - (dd.discount || 0) - (dd.marketplaceFee || 0) - (dd.shippingFee || 0);
        var recv = dd.paymentMethod === 'CASH' ? f.cashAccount : dd.paymentMethod === 'CREDIT' ? A.ACC_AR : A.ACC_AR_MARKETPLACE;
        if (net > 0) L.push([recv, net, 0]);
        if (dd.discount) L.push([A.ACC_SALES_DISCOUNT, dd.discount, 0]);
        if (dd.marketplaceFee) L.push([A.ACC_MARKETPLACE_FEE, dd.marketplaceFee, 0]);
        if (dd.shippingFee) L.push([A.ACC_SHIPPING, dd.shippingFee, 0]);
        L.push([f.categoryAccount || A.ACC_SALES, 0, amt]);
        if (dd.cogs) { L.push([A.ACC_COGS, dd.cogs, 0]); L.push([A.ACC_INVENTORY, 0, dd.cogs]); }
      }
      if (t === 'PURCHASE') {
        var dr = dd.purchaseKind === 'INVENTORY' ? A.ACC_INVENTORY : f.categoryAccount;
        L.push([dr, amt, 0]); L.push([dd.paymentMethod === 'CREDIT' ? A.ACC_AP : f.cashAccount, 0, amt]);
      }
      if (t === 'JOURNAL') (dd.lines || []).forEach(function (l) { if (l.account || l.debit || l.credit) L.push([l.account, l.debit || 0, l.credit || 0]); });
      var td = 0, tc = 0;
      L.forEach(function (l) { td += l[1]; tc += l[2]; });
      var box = $('#tfPrev', root); if (!box) return;
      box.innerHTML = '<div style="font-weight:600;margin-bottom:6px">Pratinjau jurnal otomatis</div><table>' + L.map(function (l) {
        return '<tr><td' + (l[2] ? ' style="padding-left:20px"' : '') + '>' + (l[0] ? esc(l[0] + ' · ' + accName(l[0])) : '<span class="muted">(akun belum dipilih)</span>') + '</td><td class="num">' + (l[1] ? rp(l[1]) : '') + '</td><td class="num">' + (l[2] ? rp(l[2]) : '') + '</td></tr>';
      }).join('') + '<tr style="border-top:1px solid #BFD9CC;font-weight:600"><td>Total</td><td class="num">' + rp(td) + '</td><td class="num">' + rp(tc) + '</td></tr></table>' +
        (td !== tc ? '<div class="err-text">Debit dan kredit belum seimbang (selisih ' + rp(td - tc) + ').</div>' : '') +
        (t === 'SALE' && amt && !dd.cogs ? '<div class="small" style="color:#8A4A0B;margin-top:4px">HPP belum diisi — laba kotor akan terlihat lebih tinggi sampai HPP dicatat.</div>' : '');
    }

    function drawAttachments() {
      var box = $('#tfAtt', root); if (!box) return;
      box.innerHTML = attachments.map(function (a, i) { return '<div class="row" style="gap:6px;margin-top:4px">📎 <a href="' + esc(a.url) + '" target="_blank">' + esc(a.name) + '</a><button class="btn sm ghost" data-rma="' + i + '" type="button">hapus</button></div>'; }).join('');
      $$('[data-rma]', box).forEach(function (b) { b.onclick = function () { attachments.splice(+b.dataset.rma, 1); drawAttachments(); }; });
    }
    function upload(ev) {
      var file = ev.target.files[0]; if (!file) return;
      if (file.size > 5 * 1024 * 1024) { toast('Ukuran file maksimal 5 MB.', 'err'); ev.target.value = ''; return; }
      var reader = new FileReader();
      reader.onload = function () {
        var b64 = String(reader.result).split(',')[1];
        $('#tfAtt', root).insertAdjacentHTML('beforeend', '<div class="muted" id="upl">Mengunggah ' + esc(file.name) + '…</div>');
        call('trx.upload', { name: file.name, mimeType: file.type, base64: b64 }, { write: true }).then(function (r) {
          attachments.push({ id: r.fileId, name: r.name, url: r.url }); drawAttachments();
        }).catch(function (e) { fail(e); drawAttachments(); });
        ev.target.value = '';
      };
      reader.readAsDataURL(file);
    }

    function payload(extra) {
      collect();
      return Object.assign({ type: f.type, date: f.date, amount: f.amount, categoryAccount: f.categoryAccount, cashAccount: f.cashAccount,
        toCashAccount: f.toCashAccount, description: f.description, reference: f.reference, party: f.party, details: f.details,
        attachmentIds: f.attachmentIds, idemKey: idemKey }, extra || {});
    }
    function clientValidate(post) {
      var e = [];
      if (!f.date) e.push('Tanggal wajib diisi.');
      if (f.type !== 'JOURNAL' && !(f.amount > 0)) e.push('Nominal harus lebih dari 0.');
      if (post) {
        if ((f.type === 'INCOME' || f.type === 'EXPENSE') && (!f.categoryAccount || !f.cashAccount)) e.push('Pilih kategori dan rekening kas/bank.');
        if (f.type === 'TRANSFER' && (!f.cashAccount || !f.toCashAccount)) e.push('Pilih rekening asal dan tujuan.');
        if (f.type === 'TRANSFER' && f.cashAccount && f.cashAccount === f.toCashAccount) e.push('Rekening asal dan tujuan tidak boleh sama.');
        if (S.boot.lockedPeriods.indexOf(period(f.date || '')) !== -1) e.push('Periode ' + mlabel(period(f.date)) + ' sudah ditutup.');
      }
      return e;
    }
    var busy = false;
    function setBusy(b) { busy = b; $('#overlay').dataset.busy = b ? '1' : ''; if (!b) delete $('#overlay').dataset.busy; $('#tfPost', d.parentNode).disabled = b; $('#tfDraft', d.parentNode).disabled = b; $('#tfPost', d.parentNode).textContent = b ? 'Memproses…' : 'Simpan & Posting'; }
    function submit(post, extra) {
      if (busy) return; // cegah double-click
      collect();
      var errs = clientValidate(post);
      var errEl = $('#tfErr', d.parentNode);
      errEl.textContent = errs.join(' ');
      if (errs.length) return;
      setBusy(true);
      var p;
      if (!post) p = call('trx.saveDraft', Object.assign(payload(), existing ? { trxId: existing.id, rowVersion: existing.rowVersion } : {}), { write: true });
      else if (existing) p = call('trx.saveDraft', Object.assign(payload(), { trxId: existing.id, rowVersion: existing.rowVersion }), { write: true })
        .then(function (r) { return call('trx.postDraft', Object.assign({ trxId: r.trxId, idemKey: idemKey }, extra || {}), { write: true }); });
      else p = call('trx.post', payload(extra), { write: true });
      p.then(function (r) {
        setBusy(false);
        closeDrawer();
        toast(post ? (r.duplicateSubmission ? 'Transaksi sudah tercatat sebelumnya (' + (r.trxNo || '') + ').' : 'Transaksi ' + r.trxNo + ' berhasil diposting.') : 'Draft ' + r.trxNo + ' disimpan.', 'ok');
        refreshView();
      }).catch(function (e) {
        setBusy(false);
        if (e.code === 'CONFIRM_REQUIRED') {
          ask({ title: 'Kemungkinan duplikat', message: e.message, confirm: 'Tetap simpan' }).then(function (ok) { if (ok) submit(post, { confirmDuplicate: true }); });
          return;
        }
        if (existing && e.code === 'CONFLICT') { errEl.textContent = e.message; return; }
        errEl.textContent = e.message;
        if (e.code === 'NETWORK') errEl.textContent += ' Kunci pengiriman yang sama akan dipakai saat mencoba lagi, sehingga tidak terjadi pencatatan ganda.';
      });
    }
    $('#tfPost', d.parentNode).onclick = function () { submit(true); };
    $('#tfDraft', d.parentNode).onclick = function () { submit(false); };
    draw();
  }

      var info = [['Nomor', t.no], ['Tanggal', fdate(t.date)], ['Jenis', t.typeLabel], ['Nominal', rp(t.amount)], ['Keterangan', t.form.description || '—'],
        ['Referensi', t.form.reference || '—'], ['Pihak', t.form.party || '—'], ['Dibuat', (t.createdBy || '') + ' · ' + fts(t.createdAt)]];
      if (t.postedAt) info.push(['Diposting', (t.postedBy || '') + ' · ' + fts(t.postedAt)]);
      if (t.reversedAt) info.push(['Dibalik', (t.reversedBy || '') + ' · ' + fts(t.reversedAt)]);

      var body = '<div class="row" style="margin-bottom:12px">' + badge(t.status) + '</div><table class="t">' +
        info.map(function (r) { return '<tr><td class="muted" style="width:130px">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</table>' +
        (t.attachments.length ? '<div style="margin-top:12px"><b class="small">Lampiran</b>' + t.attachments.map(function (a) { return '<div>📎 ' + (a.url ? '<a target="_blank" href="' + esc(a.url) + '">' + esc(a.name) + '</a>' : esc(a.name)) + '</div>'; }).join('') + '</div>' : '') +
        journalTable(t.journal) + (t.reversalJournal ? journalTable(t.reversalJournal) : '');
      var foot = '';
      if (t.status === 'DRAFT') foot = '<button class="btn danger" data-a="del">Hapus Draft</button><button class="btn" data-a="edit">Ubah</button><button class="btn primary" data-a="post">Posting</button>';
      if (t.status === 'FAILED') foot = '<button class="btn danger" data-a="del">Hapus</button>';
      if (t.status === 'POSTED' && isAdmin()) foot = '<button class="btn danger" data-a="rev">Balik (Reversal)</button><button class="btn" data-a="fix">Koreksi</button>';
      d = openDrawer('Transaksi ' + t.no, body, foot);
      var f = d.parentNode;
      var on = function (a, fn) { var b = $('[data-a=' + a + ']', f); if (b) b.onclick = fn; };
      on('edit', function () { openTrxForm(t.type, { id: t.id, rowVersion: t.rowVersion, form: t.form, attachments: t.attachments }); });
      on('post', function () {
        var b = $('[data-a=post]', f); b.disabled = true;
        var key = uuid();
        var go2 = function (extra) {
          call('trx.postDraft', Object.assign({ trxId: t.id, rowVersion: t.rowVersion, idemKey: key }, extra || {}), { write: true }).then(function (r) {
            closeDrawer(); toast('Transaksi ' + r.trxNo + ' berhasil diposting.', 'ok'); refreshView();
          }).catch(function (e) {
            b.disabled = false;
            if (e.code === 'CONFIRM_REQUIRED') ask({ title: 'Kemungkinan duplikat', message: e.message, confirm: 'Tetap posting' }).then(function (ok) { if (ok) go2({ confirmDuplicate: true }); });
            else fail(e);
          });
        };
        go2();
      });
      on('del', function () {
        ask({ title: 'Hapus transaksi?', message: 'Transaksi ' + t.no + ' akan ditandai terhapus. Tindakan ini dicatat di audit log.', reason: 'Alasan', reasonRequired: true, confirm: 'Hapus', danger: true }).then(function (r) {
          if (!r) return;
          call('trx.deleteDraft', { trxId: t.id, reason: r.reason, rowVersion: t.rowVersion }, { write: true }).then(function () { closeDrawer(); toast('Transaksi dihapus.', 'ok'); refreshView(); }).catch(fail);
        });
      });
      var reverse = function (thenFix) {
        ask({ title: thenFix ? 'Koreksi transaksi' : 'Balik transaksi?', message: 'Jurnal asli tetap tersimpan. Sistem membuat jurnal pembalik' + (thenFix ? ', lalu membuka form pengganti dengan data yang sama untuk Anda perbaiki.' : '.'),
          reason: 'Alasan', reasonRequired: true, confirm: thenFix ? 'Balik & buat pengganti' : 'Balik transaksi', danger: true,
          extraHtml: '<label class="field" style="margin-top:10px"><span>Tanggal pembalikan <span class="hint">kosongkan = otomatis</span></span><input class="input" type="date" id="revDate"></label>',
          collect: function (w) { return { date: $('#revDate', w).value }; } }).then(function (r) {
          if (!r) return;
          call('trx.reverse', { trxId: t.id, reason: r.reason, date: r.date || undefined, idemKey: uuid() }, { write: true }).then(function (res) {
            toast('Transaksi ' + t.no + ' dibalik.', 'ok');
            if (thenFix) { var form = res.original; form.reference = form.reference ? form.reference + '-REV' : ''; openTrxForm(form.type, null, form); }
            else closeDrawer();
            refreshView();
          }).catch(fail);
        });
      };
      on('rev', function () { reverse(false); });
      on('fix', function () { reverse(true); });
    }).catch(function (e) { $('.drawer-b', d).innerHTML = errorBox(e); });
  }

        var row = function (label, a, b, cls, code) {

  function diff(a, b) {

              pg.rows.map(function (r) { return '<tr><td style="font-family:var(--mono)">' + esc(r.sku) + '</td><td>' + esc(r.name) + '</td><td class="hide-m">' + esc(r.brand) + '</td><td class="hide-m">' + esc(r.gtin) + '</td><td class="hide-m">' + esc(r.unit) + '</td><td>' + badge(r.syncStatus === 'OK' ? 'ACTIVE' : 'FAILED').replace(/>[^<]+</, '>' + esc(r.syncStatus) + '<') + '</td></tr>'; }).join('') + '</tbody></table></div>' + pager(pg, function () {}) : '<div class="empty">Belum ada referensi produk tersinkron.</div>');
        }).catch(function (e) { $('#pBody', box).innerHTML = errorBox(e); });
      };
      var tm; $('#pq', box).oninput = function (e) { clearTimeout(tm); tm = setTimeout(function () { loadMap(e.target.value); }, 350); };
      if ($('#pSync', box)) $('#pSync', box).onclick = function () { call('product.sync', {}, { write: true }).then(function (r) { toast('Sinkron: ' + r.inserted + ' baru, ' + r.updated + ' diperbarui, ' + r.markedMissing + ' hilang dari master.', 'ok'); loadMap(); }).catch(fail); };
      if ($('#pVal', box)) $('#pVal', box).onclick = function () { call('product.validate').then(function (r) { if (r.ok) toast('Mapping valid (' + r.count + ' produk).', 'ok'); else ask({ title: 'Masalah mapping produk', message: r.issues.slice(0, 15).join(' • '), confirm: 'Tutup' }); }).catch(fail); };
      loadMap();
    }
  };

  function openAccountForm(a) {
    var isNew = !a; a = a || { code: '', name: '', type: 'EXPENSE', normal: 'D', group: 'OPEX', cashFlow: 'OPERATING', isActive: true, isHeader: false, isContra: false, parent: '6000' };
    var d = openDrawer(isNew ? 'Tambah Akun' : 'Ubah Akun ' + a.code, '<div class="form-grid" id="acf">' +
      '<label class="field"><span>Kode *</span><input class="input" name="code" value="' + esc(a.code) + '"' + (isNew ? '' : ' disabled') + ' inputmode="numeric"></label>' +
      '<label class="field"><span>Nama *</span><input class="input" name="name" value="' + esc(a.name) + '"></label>' +
      '<label class="field"><span>Tipe</span><select class="input" name="type">' + Object.keys(TYPE_LABEL).map(function (k) { return '<option value="' + k + '"' + (a.type === k ? ' selected' : '') + '>' + TYPE_LABEL[k] + '</option>'; }).join('') + '</select></label>' +
      '<label class="field"><span>Saldo normal</span><select class="input" name="normal"><option value="D"' + (a.normal === 'D' ? ' selected' : '') + '>Debit</option><option value="C"' + (a.normal === 'C' ? ' selected' : '') + '>Kredit</option></select></label>' +
      '<label class="field"><span>Grup laporan</span><select class="input" name="group">' + Object.keys(GROUP_LABEL).map(function (k) { return '<option value="' + k + '"' + (a.group === k ? ' selected' : '') + '>' + GROUP_LABEL[k] + '</option>'; }).join('') + '</select></label>' +
      '<label class="field"><span>Kategori arus kas</span><select class="input" name="cashFlow">' + ['OPERATING', 'INVESTING', 'FINANCING', 'OPENING'].map(function (k) { return '<option' + (a.cashFlow === k ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select></label>' +
      '<label class="field"><span>Induk</span><select class="input" name="parent"><option value="">—</option>' + coa().filter(function (x) { return x.isHeader; }).map(function (x) { return '<option value="' + x.code + '"' + (a.parent === x.code ? ' selected' : '') + '>' + esc(x.code + ' · ' + x.name) + '</option>'; }).join('') + '</select></label>' +
      '<label class="row small" style="gap:6px"><input type="checkbox" name="isContra"' + (a.isContra ? ' checked' : '') + '> Akun kontra</label>' +
      '<label class="row small" style="gap:6px"><input type="checkbox" name="isActive"' + (a.isActive ? ' checked' : '') + '> Aktif</label>' +
      '<label class="field full"><span>Alasan perubahan *</span><input class="input" name="reason"></label></div>',
      '<div class="err-text" id="acErr" style="flex-basis:100%"></div><button class="btn primary" id="acSave">Simpan</button>');
    var root = $('#acf', d);
    $('#acSave', d.parentNode).onclick = function () {
      call('master.coaSave', { code: val(root, 'code'), name: val(root, 'name'), type: val(root, 'type'), normal: val(root, 'normal'), group: val(root, 'group'), cashFlow: val(root, 'cashFlow'),
        parent: val(root, 'parent'), isContra: $('[name=isContra]', root).checked, isActive: $('[name=isActive]', root).checked, isHeader: !!a.isHeader, reason: val(root, 'reason'), rowVersion: a.rowVersion }, { write: true })
        .then(function () { closeDrawer(); toast('Akun disimpan.', 'ok'); reloadBoot().then(refreshView); })
        .catch(function (e) { $('#acErr', d.parentNode).textContent = e.message; });
    };
  }

  /* ================= PENGATURAN ================= */
  VIEWS.settings = function (el) {
    var tabs = [['me', 'Akun Saya']];
    if (isAdmin()) tabs = tabs.concat([['users', 'Pengguna'], ['periods', 'Periode'], ['system', 'Sistem'], ['backup', 'Backup'], ['diag', 'Diagnostik'], ['audit', 'Audit Log']]);
    var st = S.state.set = S.state.set || { tab: 'me' };
    if (!tabs.some(function (t) { return t[0] === st.tab; })) st.tab = 'me';
    el.innerHTML = '<div class="tabs">' + tabs.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (st.tab === t[0] ? 'active' : '') + '">' + t[1] + '</button>'; }).join('') + '</div><div id="stBody"></div>';
    $$('.tabs button', el).forEach(function (b) { b.onclick = function () { st.tab = b.dataset.t; VIEWS.settings(el); }; });
    var box = $('#stBody', el);
    var T = SETTINGS_TABS[st.tab];
    T(box, function () { VIEWS.settings(el); });
  };

  var SETTINGS_TABS = {
    me: function (box) {
      box.innerHTML = '<div class="grid g2"><div class="card card-b"><h3 style="margin-bottom:12px">Profil</h3><table class="t"><tr><td class="muted">Nama</td><td>' + esc(S.user.name) + '</td></tr><tr><td class="muted">Email</td><td>' + esc(S.user.email) + '</td></tr><tr><td class="muted">Peran</td><td>' + esc(ROLE_LABEL[S.user.role]) + '</td></tr></table></div>' +
        '<div class="card card-b"><h3 style="margin-bottom:12px">Ganti kata sandi</h3><div id="pwf">' + passwordFormHtml() + '<button class="btn primary" style="margin-top:12px" id="pwGo">Simpan</button></div></div></div>';
      $('#pwGo', box).onclick = function () { savePassword($('#pwf', box), function () { $$('#pwf input', box).forEach(function (i) { i.value = ''; }); }); };
    },
    users: function (box, reload) {
      box.innerHTML = '<div class="row" style="margin-bottom:12px"><button class="btn primary" id="uAdd">' + icon('plus') + 'Tambah Pengguna</button></div><div class="card" id="uT">' + skeleton(4) + '</div>';
      var roleSel = function (id, cur) { return '<select class="input" id="' + id + '">' + ['ADMIN', 'FINANCE', 'VIEWER'].map(function (r) { return '<option value="' + r + '"' + (cur === r ? ' selected' : '') + '>' + ROLE_LABEL[r] + '</option>'; }).join('') + '</select>'; };
      var showPw = function (email, pw) { ask({ title: 'Kata sandi sementara', message: 'Berikan kata sandi ini secara langsung kepada ' + email + '. Kata sandi hanya ditampilkan sekali dan wajib diganti saat login pertama.', extraHtml: '<div class="input" style="display:flex;align-items:center;font-family:var(--mono);font-size:16px;user-select:all">' + esc(pw) + '</div>', confirm: 'Sudah dicatat' }); };
      $('#uAdd', box).onclick = function () {
        ask({ title: 'Tambah pengguna', message: 'Pengguna login dengan email dan kata sandi sementara.', confirm: 'Buat pengguna',
          extraHtml: '<div class="stack"><label class="field"><span>Nama</span><input class="input" id="uN"></label><label class="field"><span>Email</span><input class="input" type="email" id="uE"></label><label class="field"><span>Peran</span>' + roleSel('uR', 'FINANCE') + '</label></div>',
          collect: function (w) { return { name: $('#uN', w).value, email: $('#uE', w).value, role: $('#uR', w).value }; } }).then(function (r) {
          if (!r) return;
          call('user.create', r, { write: true }).then(function (x) { showPw(x.email, x.temporaryPassword); reload(); }).catch(fail);
        });
      };
      call('user.list').then(function (list) {
        $('#uT', box).innerHTML = '<div class="table-wrap"><table class="t"><thead><tr><th>Nama</th><th>Email</th><th>Peran</th><th>Status</th><th class="hide-m">Login terakhir</th><th></th></tr></thead><tbody>' +
          list.map(function (u) { return '<tr><td>' + esc(u.name) + '</td><td>' + esc(u.email) + '</td><td>' + esc(ROLE_LABEL[u.role]) + '</td><td>' + badge(u.status) + '</td><td class="hide-m small">' + fts(u.lastLoginAt) + '</td><td class="num"><button class="btn sm" data-e="' + esc(u.userId) + '">Ubah</button> <button class="btn sm" data-r="' + esc(u.userId) + '">Reset sandi</button></td></tr>'; }).join('') + '</tbody></table></div>';
        $$('[data-e]', box).forEach(function (b) { b.onclick = function () {
          var u = list.filter(function (x) { return x.userId === b.dataset.e; })[0];
          ask({ title: 'Ubah ' + u.email, message: '', reason: 'Alasan perubahan', reasonRequired: true, confirm: 'Simpan',
            extraHtml: '<div class="form-grid" style="margin-top:10px"><label class="field"><span>Peran</span>' + roleSel('eR', u.role) + '</label><label class="field"><span>Status</span><select class="input" id="eS"><option value="ACTIVE"' + (u.status === 'ACTIVE' ? ' selected' : '') + '>Aktif</option><option value="DISABLED"' + (u.status === 'DISABLED' ? ' selected' : '') + '>Nonaktif</option></select></label></div>',
            collect: function (w) { return { role: $('#eR', w).value, status: $('#eS', w).value }; } }).then(function (r) {
            if (!r) return;
            call('user.update', { userId: u.userId, role: r.role, status: r.status, reason: r.reason, rowVersion: u.rowVersion }, { write: true }).then(function () { toast('Pengguna diperbarui.', 'ok'); reload(); }).catch(fail);
          });
        }; });
        $$('[data-r]', box).forEach(function (b) { b.onclick = function () {
          var u = list.filter(function (x) { return x.userId === b.dataset.r; })[0];
          ask({ title: 'Reset kata sandi ' + u.email + '?', message: 'Kata sandi lama tidak berlaku lagi.', reason: 'Alasan', reasonRequired: true, confirm: 'Reset', danger: true }).then(function (r) {
            if (!r) return;
            call('user.resetPassword', { userId: u.userId, reason: r.reason }, { write: true }).then(function (x) { showPw(u.email, x.temporaryPassword); }).catch(fail);
          });
        }; });
      }).catch(function (e) { $('#uT', box).innerHTML = errorBox(e); });
    },
    periods: function (box, reload) {
      box.innerHTML = '<p class="muted small">Periode yang ditutup tidak dapat menerima posting, pembalikan, atau penyusutan baru. Membuka kembali periode wajib alasan dan dicatat.</p><div class="card" id="pT">' + skeleton(6) + '</div>';
      call('period.list').then(function (list) {
        var map = {}; list.forEach(function (p) { map[p.period] = p; });
        var cur = period(today()), rows = [];
        for (var i = 0; i < 18; i++) rows.push(addMonths(cur, -i));
        $('#pT', box).innerHTML = '<div class="table-wrap"><table class="t"><thead><tr><th>Periode</th><th>Status</th><th class="hide-m">Terakhir diubah</th><th class="hide-m">Alasan</th><th></th></tr></thead><tbody>' +
          rows.map(function (p) {
            var r = map[p] || { status: 'OPEN' };
            var locked = r.status === 'LOCKED';
            return '<tr><td>' + mlabel(p) + '</td><td>' + badge(r.status) + '</td><td class="hide-m small">' + esc(locked ? (r.lockedBy || '') + ' ' + fts(r.lockedAt) : (r.reopenedBy ? r.reopenedBy + ' ' + fts(r.reopenedAt) : '')) + '</td><td class="hide-m small">' + esc(r.reason || '') + '</td>' +
              '<td class="num"><button class="btn sm' + (locked ? ' danger' : '') + '" data-p="' + p + '" data-l="' + (locked ? '0' : '1') + '">' + (locked ? 'Buka' : 'Tutup buku') + '</button></td></tr>';
          }).join('') + '</tbody></table></div>';
        $$('[data-p]', box).forEach(function (b) { b.onclick = function () {
          var lock = b.dataset.l === '1';
          ask({ title: (lock ? 'Tutup' : 'Buka kembali') + ' periode ' + mlabel(b.dataset.p) + '?', message: lock ? 'Pastikan penyusutan periode ini sudah diposting.' : 'Membuka periode memungkinkan perubahan pada laporan yang sudah final.',
            reason: 'Alasan', reasonRequired: !lock, confirm: lock ? 'Tutup periode' : 'Buka periode', danger: !lock }).then(function (r) {
            if (!r) return;
            call(lock ? 'period.lock' : 'period.unlock', { period: b.dataset.p, reason: r.reason }, { write: true }).then(function () { toast('Periode diperbarui.', 'ok'); reloadBoot().then(reload); }).catch(fail);
          });
        }; });
      }).catch(function (e) { $('#pT', box).innerHTML = errorBox(e); });
    },
    system: function (box, reload) {
      box.innerHTML = skeleton(6);
      call('settings.get').then(function (s) {
        var row = function (x, isAcc) {
          return '<tr><td><b class="small">' + esc(x.key) + '</b><div class="muted small">' + esc(isAcc ? 'Default ' + x.defaultValue + ' · ' + accName(x.defaultValue) : x.description) + '</div></td><td style="width:260px">' +
            (isAcc ? '<select class="input" data-k="' + esc(x.key) + '">' + options(postableAccounts(), x.value) + '</select>' : '<input class="input" data-k="' + esc(x.key) + '" value="' + esc(x.value) + '">') + '</td></tr>';
        };
        box.innerHTML = '<div class="grid g2"><div class="card"><div class="card-h"><h3>Umum</h3></div><table class="t">' + s.general.map(function (x) { return row(x, false); }).join('') + '</table></div>' +
          '<div class="card"><div class="card-h"><h3>Pemetaan akun sistem</h3><span class="muted small">risiko tinggi — wajib alasan</span></div><div class="table-wrap"><table class="t">' + s.accounts.map(function (x) { return row(x, true); }).join('') + '</table></div></div></div>' +
          '<div class="card card-b" style="margin-top:16px"><h3>Integrasi Master SKU</h3><p class="small muted">Spreadsheet: ' + esc(s.masterSku.spreadsheetId || '(belum diatur)') + ' · Sheet: ' + esc(s.masterSku.sheetName) + '. Diatur lewat Script Properties oleh pemilik skrip.</p></div>';
        $$('[data-k]', box).forEach(function (inp) {
          inp.dataset.orig = inp.value;
          inp.onchange = function () {
            ask({ title: 'Ubah ' + inp.dataset.k + '?', message: 'Dari "' + inp.dataset.orig + '" menjadi "' + inp.value + '".', reason: 'Alasan', reasonRequired: true, confirm: 'Simpan' }).then(function (r) {
              if (!r) { inp.value = inp.dataset.orig; return; }
              call('settings.save', { key: inp.dataset.k, value: inp.value, reason: r.reason }, { write: true }).then(function () { toast('Pengaturan disimpan.', 'ok'); reloadBoot().then(reload); })
                .catch(function (e) { inp.value = inp.dataset.orig; fail(e); });
            });
          };
        });
      }).catch(function (e) { box.innerHTML = errorBox(e); });
    },
    backup: function (box, reload) {
      box.innerHTML = '<div class="row" style="margin-bottom:12px"><button class="btn primary" id="bk">Backup sekarang</button><span class="muted small">Backup otomatis harian aktif setelah pemilik menjalankan installTriggers().</span></div><div class="card" id="bkT">' + skeleton(4) + '</div>';
      $('#bk', box).onclick = function (e) { e.target.disabled = true; call('backup.run', {}, { write: true }).then(function (r) { toast('Backup dibuat: ' + r.name, 'ok'); reload(); }).catch(function (x) { e.target.disabled = false; fail(x); }); };
      call('backup.list').then(function (d) {
        $('#bkT', box).innerHTML = '<div class="card-b small">Backup terakhir: <b>' + (d.lastBackupAt ? fts(d.lastBackupAt) : 'belum pernah') + '</b></div>' + (d.backups.length ? '<table class="t"><thead><tr><th>File</th><th>Dibuat</th></tr></thead><tbody>' +
          d.backups.map(function (b) { return '<tr><td><a href="' + esc(b.url) + '" target="_blank">' + esc(b.name) + '</a></td><td>' + esc(b.createdAt) + '</td></tr>'; }).join('') + '</tbody></table>' : '<div class="empty">Belum ada file backup.</div>');
      }).catch(function (e) { $('#bkT', box).innerHTML = errorBox(e); });
    },
    diag: function (box) {
      box.innerHTML = '<div class="row" style="margin-bottom:12px"><button class="btn primary" id="dg">Jalankan diagnostik</button><button class="btn" id="rc">Pulihkan posting tertunda</button></div><div id="dgB" class="card card-b muted">Diagnostik memeriksa keseimbangan jurnal, posting tertunda, neraca, rekonsiliasi kas, dan register aset.</div>';
      $('#dg', box).onclick = function () {
        $('#dgB', box).innerHTML = skeleton(5);
        call('diag.run').then(function (d) {
          $('#dgB', box).innerHTML = '<div class="banner ' + (d.ok ? 'ok' : 'err') + '" style="margin-bottom:10px">' + (d.ok ? 'Semua pemeriksaan lulus.' : 'Ada pemeriksaan yang gagal.') + ' · ' + fts(d.at) + '</div><table class="t">' +
            d.checks.map(function (c) { return '<tr><td style="width:28px">' + (c.ok ? '✅' : '❌') + '</td><td>' + esc(c.name) + (c.detail ? '<div class="muted small">' + esc(c.detail) + '</div>' : '') + '</td></tr>'; }).join('') + '</table>';
        }).catch(function (e) { $('#dgB', box).innerHTML = errorBox(e); });
      };
      $('#rc', box).onclick = function () {
        ask({ title: 'Pulihkan posting tertunda?', message: 'Record PENDING dari proses yang terhenti akan diselesaikan (jika jurnal sudah lengkap) atau ditandai GAGAL agar dapat dikirim ulang.', confirm: 'Pulihkan' }).then(function (ok) {
          if (!ok) return;
          call('diag.recover', {}, { write: true }).then(function (r) { toast('Pemulihan: ' + r.journals + ' jurnal, ' + r.transactions + ' transaksi, ' + r.assets + ' aset.', 'ok'); }).catch(fail);
        });
      };
    },
    audit: function (box) {
      var st = { page: 1, search: '' };
      box.innerHTML = '<div class="card"><div class="card-h"><input class="input" style="max-width:320px" placeholder="Cari aksi, email, alasan…" id="aq"></div><div id="aT">' + skeleton(6) + '</div></div>';
      var load = function () {
        call('audit.list', { page: st.page, pageSize: 50, search: st.search }).then(function (pg) {
          $('#aT', box).innerHTML = pg.rows.length ? '<div class="table-wrap"><table class="t"><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th class="hide-m">Entitas</th><th>Alasan</th></tr></thead><tbody>' +
            pg.rows.map(function (r) { return '<tr><td class="small">' + fts(r.at) + '</td><td class="small">' + esc(r.user) + '</td><td><code class="small">' + esc(r.action) + '</code></td><td class="hide-m small muted">' + esc(r.entity + ' ' + (r.entityId || '').substring(0, 13)) + '</td><td class="small">' + esc(r.reason) + '</td></tr>'; }).join('') +
            '</tbody></table></div>' + pager(pg, function (p) { st.page = p; load(); }) : '<div class="empty">Tidak ada data.</div>';
        }).catch(function (e) { $('#aT', box).innerHTML = errorBox(e); });
      };
      var tm; $('#aq', box).oninput = function (e) { clearTimeout(tm); tm = setTimeout(function () { st.search = e.target.value; st.page = 1; load(); }, 350); };
      load();
    }
  };

  /* ================= Mulai ================= */
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('#overlay').innerHTML && !$('#overlay').dataset.busy && !document.querySelector('.dialog')) closeDrawer(); });
  /* PWA (GitHub Pages): service worker + pembaruan otomatis saat versi baru terbit. */
  if (window.MFAS_BUILD) {
    try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) { /* abaikan */ }
    var checkUpdate = function () {
      fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
        if (!v || !v.v || v.v === window.MFAS_BUILD) return;
        // Jangan ganggu pengguna yang sedang mengisi form.
        if ($('#overlay').innerHTML || document.querySelector('.dialog')) { setTimeout(checkUpdate, 30000); return; }
        toast('Memperbarui aplikasi ke versi terbaru…', 'ok');
        setTimeout(function () { location.reload(); }, 800);
      }).catch(function () {});
    };
    setInterval(checkUpdate, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) checkUpdate(); });
  }

  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (S.boot && h && h !== S.view && VIEWS[h]) go(h);
  });
  S.token = store.get('mfas_token');
  if (S.token) start(); else showLogin('');
})();
</script>
